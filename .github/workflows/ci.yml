name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: pwsh

jobs:
  build:
    name: Install, test and build
    runs-on: [self-hosted, Windows, X64, scheduler-app]
    timeout-minutes: 20
    env:
      # Keep Create React App strict: ESLint and webpack warnings fail the build.
      CI: 'true'
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js 20
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Preflight - reject conflict markers and tracked .env
        run: |
          $markers = Get-ChildItem -Path src, public -Recurse -File |
            Select-String -Pattern '^(<{7}|={7}|>{7})( |$)'
          if ($markers) {
            $markers | ForEach-Object {
              Write-Host "::error file=$($_.Path),line=$($_.LineNumber)::$($_.Line)"
            }
            throw 'Unresolved merge-conflict markers found.'
          }

          $envFile = git ls-files .env
          if ($envFile) {
            throw 'A .env file is tracked in this repository.'
          }

          Write-Host 'Preflight OK.'

      - name: Install dependencies (reproducible)
        run: npm ci --no-audit --no-fund

      - name: Show tool versions
        run: |
          node --version
          npm --version
          git --version

      - name: Run tests
        run: npm test -- --watchAll=false --ci --passWithNoTests

      - name: Production build
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: build-${{ github.sha }}
          path: build/
          if-no-files-found: error
          retention-days: 7
